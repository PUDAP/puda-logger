services:
  reductstore:
    image: reduct/store:latest
    container_name: reduct-store
    restart: unless-stopped
    ports:
      - "${REDUCTSTORE_PORT:-8383}:8383"
    env_file:
      - .env
    environment:
      # Optional: Set an admin API token for security (Defaults to 'reduct' if not set)
      - RS_API_TOKEN=${RS_API_TOKEN:-reduct}
      - RS_LOG_LEVEL=${RS_LOG_LEVEL:-INFO}
      - RS_BUCKET_PUDA_NAME=${REDUCTSTORE_BUCKET:-puda}
    volumes:
      # OPTION 1: Host Bind Mount (NAS already mounted on host)
      - ./data:/data
