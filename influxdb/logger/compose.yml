services:
  influxdb-logger:
    build: .
    image: pudap/influxdb-logger:telegraf
    container_name: influxdb-logger
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PUDA_NATS_CA: "${PUDA_NATS_CA:+/run/puda-ca/ca.pem}"
      PUDA_E2E_KEY_FILE: "${PUDA_E2E_KEY_FILE:+/run/puda-key/e2e.key}"
    volumes:
      - ./telegraf.conf.template:/etc/telegraf/telegraf.conf.template:ro
      # Unset variables mount /dev/null as an unused placeholder for plaintext mode.
      - type: bind
        source: ${PUDA_NATS_CA:-/dev/null}
        target: /run/puda-ca/ca.pem
        read_only: true
        bind:
          create_host_path: false
      # The SDK updates this file in place, so rotations persist to the host.
      - type: bind
        source: ${PUDA_E2E_KEY_FILE:-/dev/null}
        target: /run/puda-key/e2e.key
        bind:
          create_host_path: false
    # The Python subscriber initializes response streams using the same TLS settings.
