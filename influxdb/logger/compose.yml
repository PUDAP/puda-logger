services:
  nats-stream-init:
    image: natsio/nats-box:latest
    container_name: influxdb-logger-nats-init
    network_mode: host
    entrypoint: ["/bin/sh", "/nats-init.sh"]
    env_file:
      - .env
    volumes:
      - ./nats-init.sh:/nats-init.sh:ro
    restart: "no"

  # Replicas share the NATS queue groups in telegraf.conf.template, so each
  # message is delivered to exactly one logger. Do not set container_name —
  # Compose cannot scale a service that pins a single name.
  # Size: one replica per 10–20k machines; raise LOGGER_REPLICAS if Telegraf
  # CPU is pegged or logs show metric_buffer_limit drops.
  influxdb-logger:
    build: .
    image: pudap/influxdb-logger:telegraf
    restart: unless-stopped
    network_mode: host
    scale: ${LOGGER_REPLICAS:-1}
    labels:
      - "autoheal=true"
    env_file:
      - .env
    volumes:
      - ./telegraf.conf.template:/etc/telegraf/telegraf.conf.template:ro
    depends_on:
      nats-stream-init:
        condition: service_completed_successfully

  # Docker does not restart containers on its own when a HEALTHCHECK reports
  # "unhealthy" (only Swarm does). This watches for that status on services
  # labeled autoheal=true and restarts them - needed because the Telegraf
  # stall that healthcheck.sh detects otherwise persists until someone
  # notices and manually restarts the logger replica(s).
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: influxdb-logger-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 90
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
